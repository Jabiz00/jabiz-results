    return '<div class="tr"><div class="trh">'+initial(t.symbol)+'<span class="tn">'+esc(t.symbol)+' <small>/ SOL</small></span>'+(isNum(t.unresolved_ts)?'<span class="tg bd">UNRESOLVED</span>':badge(t.research_status))+(chg==null?'<span class="pc w" style="font-size:12px">No price</span>':'<span class="pc '+(chg>=0?"g":"r")+'">'+pct(chg,2)+'</span>')+'</div>'
     +'<div class="tv"><span>Entry: '+fmtPrice(t.entry_mid)+'</span><span>'+(chg==null?"No price for "+(t.missed_polls||0)+" checks":"Current: "+fmtPrice(t.last_mid))+'</span></div><div class="track"><div class="e" style="left:'+ent.toFixed(1)+'%"></div>'+(pos==null?'':'<div class="p" style="left:'+pos.toFixed(1)+'%"></div>')+'</div><div class="tl"><span>SL -'+sp+'%</span><span>Entry</span><span>TP +'+tp+'%</span></div>'
     +'<div class="tv"><span>Held: '+held(t.entry_ts,now)+' of '+(rules.max_hold_hours||"?")+'h</span><span>Size: <b class="g">'+money(t.cost_usd)+'</b></span></div>'+addrRow(t.mint)+'</div>'}).join(""):'<span class="m">No open trades right now.</span>')
   +'<div class="note">Tap Copy to copy the full contract address. Solscan and DexScreener open the coin&rsquo;s public pages. Addresses are for reference only. This is practice data, not a recommendation to buy anything.</div></div>';
  $("right").innerHTML=O;
}
function copyText(text,btn){var done=function(){var o=btn.textContent;btn.textContent="Copied";setTimeout(function(){btn.textContent=o},1200)};
  var fb=function(){try{var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);done()}catch(e){}};
  if(typeof navigator!=="undefined"&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb()}
document.addEventListener("click",function(e){var t=e.target;if(!t||!t.closest)return;var c=t.closest("[data-copy]");if(c){e.preventDefault();copyText(c.getAttribute("data-copy"),c);return}
  var rb=t.closest("[data-range]");if(rb&&STATE.data){STATE.range=rb.getAttribute("data-range");render(STATE.data,STATE.sample)}});
function live(){return fetch("data.json?ts="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
  .then(function(d){if(!d||!d.books||!d.books.main)throw new Error("old format");render(d,false)}).catch(function(){if(!STATE.data||STATE.sample)render(SAMPLE,true)})}
live();setInterval(live,300000);
</script>
