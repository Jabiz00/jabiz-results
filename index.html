<title>Jabiz paper bot results</title>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 2px}h2{font-size:1.02rem;margin:22px 0 8px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.banner{border-left:5px solid var(--warn)}.banner.good{border-color:var(--good)}.banner.bad{border-color:var(--bad)}
.banner b{display:block;font-size:1.02rem;margin-bottom:2px}

button.alt,.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
input[type=file]{display:none}
.msg{font-size:.88rem;margin-top:8px;color:var(--muted)}.msg.err{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:14px;padding:12px}.kpi .l{font-size:.78rem;color:var(--muted)}.kpi .v{font-size:1.35rem;font-weight:700}
.kpi .h{font-size:.75rem;color:var(--muted);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--accent)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.88rem}.row .n{width:150px;flex:none}.row .b{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}.row .b>i{display:block;height:100%;background:var(--accent)}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
svg{width:100%;height:auto;display:block}
.small{font-size:.8rem;color:var(--muted)}
</style>
</head>

   +'<div class="kpi"><div class="l">Finished trades</div><div class="v">'+S.n+'</div><div class="h">'+S.open+' still open</div></div>'
   +'<div class="kpi"><div class="l">Win rate</div><div class="v">'+(S.winRate==null?"n/a":S.winRate.toFixed(0)+"%")+'</div><div class="h">trades that made money</div></div>'
   +'<div class="kpi"><div class="l">Average trade</div><div class="v '+(S.avgPct>0?"pos":S.avgPct<0?"neg":"")+'">'+pct(S.avgPct,2)+'</div><div class="h">after fees and slippage</div></div>'
   +'<div class="kpi"><div class="l">Profit factor</div><div class="v">'+(S.pf==null?"n/a":S.pf.toFixed(2))+'</div><div class="h">above 1 = wins beat losses</div></div>'
   +'<div class="kpi"><div class="l">Worst dip</div><div class="v neg">'+(S.eqs.length?S.maxDD.toFixed(1)+"%":"n/a")+'</div><div class="h">biggest fall from a peak</div></div></div>';
  h+='<h2>Balance over time</h2><div class="card">'+chart(S,d)+'</div>';
  var op=(d.open||[]);
  h+='<h2>Open trades ('+op.length+')</h2><div class="card scroll">'+(op.length?'<table><tr><th>Token</th><th>Label</th><th>Change</th><th>Held</th><th></th></tr>'
   +op.map(function(p){var c=p.entry_mid?(p.last_mid/p.entry_mid-1)*100:null;return '<tr><td>'+esc(p.symbol)+'</td><td>'+esc(p.research_status)+'</td><td class="'+(c>0?"pos":c<0?"neg":"")+'">'+pct(c)+'</td><td>'+ago(p.entry_ts,now)+'</td><td>'+((p.missed_polls||0)>0?'<span class="neg">no price</span>':'')+'</td></tr>'}).join("")+'</table>':'None right now.')+'</div>';
  var cl=(d.closed||[]).slice().sort(function(a,b){return (b.exit_ts||0)-(a.exit_ts||0)}).slice(0,25);
  h+='<h2>Latest finished trades</h2><div class="card scroll">'+(cl.length?'<table><tr><th>Token</th><th>Result</th><th>Why it ended</th><th>When</th></tr>'
   +cl.map(function(t){return '<tr><td>'+esc(t.symbol)+'</td><td class="'+(t.pnl_usd>0?"pos":"neg")+'">'+pct(t.pnl_pct)+' ('+money(t.pnl_usd)+')</td><td>'+esc(WHY[t.exit_reason]||t.exit_reason)+'</td><td>'+ago(t.exit_ts,now)+' ago</td></tr>'}).join("")+'</table>':'No finished trades yet.')+'</div>';
  var mx=Math.max.apply(null,Object.keys(S.reasons).map(function(k){return S.reasons[k]}).concat([1]));
  h+='<h2>How trades ended</h2><div class="card">'+(Object.keys(S.reasons).length?Object.keys(S.reasons).map(function(k){return '<div class="row"><span class="n">'+esc(WHY[k]||k)+'</span><span class="b"><i style="width:'+S.reasons[k]/mx*100+'%"></i></span><span>'+S.reasons[k]+'</span></div>'}).join(""):'Nothing yet.')+'</div>';
  if(S.labels.length)h+='<h2>Does the bot’s rating matter?</h2><div class="card"><table><tr><th>Rating</th><th>Trades</th><th>Average result</th></tr>'+S.labels.map(function(l){return '<tr><td>'+esc(l.label)+'</td><td>'+l.count+'</td><td class="'+(l.avg>0?"pos":"neg")+'">'+pct(l.avg,2)+'</td></tr>'}).join("")+'</table><p class="small">If higher ratings don’t do better over 100+ trades, the rating isn’t helping.</p></div>';
  if(S.skips.length)h+='<h2>Why the bot skipped tokens</h2><div class="card">'+S.skips.map(function(s){return '<div class="row"><span class="n" style="width:auto;flex:1">'+esc(s.reason)+'</span><span>'+s.n+'</span></div>'}).join("")+'</div>';
  if(d.last_cycle_ts)h+='<p class="small">Last bot cycle: '+ago(d.last_cycle_ts,now)+' ago. This page refreshes itself every 5 minutes while open.</p>';
  h+='<details class="card"><summary>What do these words mean?</summary><p class="small"><b>Stop-loss:</b> sells automatically if the price falls a set amount. <b>Trailing stop:</b> follows the price up and sells on a pullback. <b>Profit factor:</b> total money won divided by total money lost. <b>Worst dip:</b> the biggest fall from a high point. <b>Fees and slippage:</b> costs the simulation charges so results aren’t too rosy. This is practice only. Strong numbers here do not promise real profit.</p></details>';
  $("out").innerHTML=h;
}
function show(text,isSample,isLive){
  var m=$("msg");m.className="msg";
  try{var d=JSON.parse(text);if(!d||typeof d!=="object"||(!Array.isArray(d.closed)&&!Array.isArray(d.open)))throw new Error("shape");
    render(d,isSample);m.textContent=isSample?"Showing made-up sample data.":isLive?"Live results loaded.":"Results loaded.";
    if(!isSample&&!isLive){try{localStorage.setItem("jabiz_last",text)}catch(e){}}
    return true
  }catch(e){m.className="msg err";m.textContent="That doesn’t look like the results file. Open data.json in GitHub, tap Raw, select all, copy and paste it here.";return false}
}
$("go").onclick=function(){show($("paste").value.trim(),false,false)};
$("sample").onclick=function(){show(JSON.stringify(SAMPLE),true,false)};
$("file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){show(String(r.result),false,false)};r.readAsText(f)};
var liveOk=false;
function live(){
  return fetch("data.json?ts="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text()})
   .then(function(t){if(show(t,false,true)){liveOk=true;$("live").textContent="";$("manual").open=false}})
   .catch(function(){if(!liveOk){$("live").textContent="No live data yet. It appears after the bot’s first published run.";fallback()}});
}
function fallback(){
  var shown=false;try{var last=localStorage.getItem("jabiz_last");if(last){shown=show(last,false,false);$("msg").textContent="Showing the last results you pasted. Live data will replace this once available."}}catch(e){}
  if(!shown)$("manual").open=true;
}
live();setInterval(live,300000);
</script>
</body>
</html>
